<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FlowCore</title>
    <script>
      try {
        var cachedSeo = localStorage.getItem('flowcore_cached_seo');
        if (cachedSeo) {
          var parsedSeo = JSON.parse(cachedSeo);
          if (parsedSeo && parsedSeo.title) document.title = parsedSeo.title;
        }
      } catch (error) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
