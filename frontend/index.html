    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "PiLauncher",
        "applicationCategory": "GameApplication",
        "operatingSystem": "Windows, macOS, Linux",
        "description": "PiLauncher 是一款为掌机打造、兼容全平台的 Minecraft 启动器，让模组管理、账号登录和游戏启动更简单。",
        "url": "https://pil.nav4ai.net/"
      }
    </script>
    <style>
      :root {
        color-scheme: light dark;
      }

      body {
        margin: 0;
      }

      html[data-static-home="hidden"] #static-home-showcase {
        display: none;
      }

      html.dark {
        color-scheme: dark;
      }

      #static-home-showcase {
        min-height: 100vh;
        overflow: hidden;
        background:
          radial-gradient(circle at 15% 18%, rgba(16, 185, 129, 0.18), transparent 28rem),
          radial-gradient(circle at 85% 12%, rgba(14, 165, 233, 0.16), transparent 30rem),
          linear-gradient(135deg, #ecfdf5 0%, #f8fafc 52%, #fffbeb 100%);
        color: #0f172a;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .static-home-theme-toggle {
        position: absolute;
        top: 1.25rem;
        right: 1.25rem;
        display: inline-flex;
        height: 2.75rem;
        width: 2.75rem;
        align-items: center;
        justify-content: center;
        border: 1px solid rgba(15, 23, 42, 0.12);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.78);
        color: #0f172a;
        box-shadow: 0 14px 36px rgba(15, 23, 42, 0.1);
        cursor: pointer;
        transition: border-color 0.2s ease, background 0.2s ease, color 0.2s ease, transform 0.2s ease;
      }

      .static-home-theme-toggle:hover {
        transform: translateY(-1px);
        border-color: rgba(16, 185, 129, 0.36);
      }

      .static-home-theme-toggle svg {
        height: 1.15rem;
        width: 1.15rem;
      }

      .static-home-theme-toggle .moon-icon {
        display: none;
      }

      .static-home-shell {
        box-sizing: border-box;
        position: relative;
        display: block;
        min-height: 100vh;
        max-width: 1280px;
        margin: 0 auto;
        padding: 6rem 1.5rem 5rem;
      }

      .static-home-copy {
        position: relative;
        z-index: 2;
        min-width: 0;
        max-width: 820px;
      }

      .static-home-kicker {
        display: inline-flex;
        width: fit-content;
        align-items: center;
        gap: 0.5rem;
        border: 1px solid rgba(16, 185, 129, 0.24);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.74);
        padding: 0.45rem 0.8rem;
        color: #047857;
        font-size: 0.75rem;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .static-home-title {
        max-width: 720px;
        margin: 1.5rem 0 0;
        color: #0f172a;
        font-size: clamp(3.5rem, 6.2vw, 5.75rem);
        line-height: 0.92;
        letter-spacing: 0;
      }

      .static-home-subtitle {
        display: block;
        margin-top: 0.26em;
        font-size: clamp(2.7rem, 4.8vw, 4.4rem);
        line-height: 1.04;
      }

      .static-home-subtitle span {
        display: block;
        width: fit-content;
        background: linear-gradient(90deg, #059669, #65a30d);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      .static-home-description {
        max-width: 620px;
        margin: 1.75rem 0 0;
        color: #475569;
        font-size: clamp(1rem, 1.6vw, 1.15rem);
        line-height: 1.85;
      }

      .static-home-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.875rem;
        margin-top: 2.25rem;
      }

      .static-home-button {
        display: inline-flex;
        min-height: 3.25rem;
        align-items: center;
        justify-content: center;
        border-radius: 999px;
        padding: 0 1.35rem;
        border: 1px solid transparent;
        text-decoration: none;
        font-size: 0.95rem;
        font-weight: 800;
      }

      .static-home-button.primary {
        background: #064e3b;
        color: #fff;
        box-shadow: 0 18px 45px rgba(6, 78, 59, 0.24);
      }

      .static-home-button.secondary {
        border-color: rgba(15, 23, 42, 0.12);
        background: rgba(255, 255, 255, 0.72);
        color: #0f172a;
      }

      .static-home-points {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 1rem;
        margin-top: 3rem;
      }

      .static-home-point {
        box-sizing: border-box;
        min-height: 8rem;
        border: 1px solid rgba(15, 23, 42, 0.08);
        border-radius: 1rem;
        background: rgba(255, 255, 255, 0.68);
        padding: 1.15rem;
        box-shadow: 0 16px 50px rgba(15, 23, 42, 0.06);
      }

      .static-home-point strong {
        display: block;
        font-size: 0.95rem;
      }

      .static-home-point span {
        display: block;
        margin-top: 0.55rem;
        color: #64748b;
        font-size: 0.875rem;
        line-height: 1.6;
      }

      .static-home-logo-stack {
        position: absolute;
        top: 41%;
        right: clamp(1.5rem, 8vw, 7rem);
        z-index: 1;
        width: min(680px, 54vw);
        aspect-ratio: 1;
        overflow: visible;
        pointer-events: none;
        transform: translateY(-50%);
      }

      .static-logo-orbit {
        --static-logo-color: #10b981;
        position: relative;
        height: 100%;
        width: 100%;
        isolation: isolate;
      }

      .static-logo-orbit::before {
        position: absolute;
        inset: 14%;
        z-index: 0;
        border-radius: 999px;
        background:
          radial-gradient(circle, color-mix(in srgb, var(--static-logo-color) 22%, transparent) 0%, transparent 62%),
          radial-gradient(circle at 68% 26%, rgba(14, 165, 233, 0.12), transparent 42%);
        content: "";
        filter: blur(14px);
        opacity: 0.58;
      }

      .static-logo-card {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        opacity: 0.3;
        filter: saturate(0.96) contrast(0.98);
      }

      .static-logo-mark {
        position: relative;
        z-index: 1;
        display: grid;
        width: 88%;
        aspect-ratio: 1;
        place-items: center;
      }

      .static-logo-mark img {
        display: block;
        max-height: 100%;
        max-width: 100%;
        object-fit: contain;
        filter: drop-shadow(0 22px 38px rgba(15, 23, 42, 0.1));
      }

      .static-logo-fallback {
        display: grid;
        height: 100%;
        width: 100%;
        place-items: center;
        border-radius: 32%;
        background: linear-gradient(135deg, #059669, #65a30d);
        color: #fff;
        font-size: clamp(2.4rem, 7vw, 5.4rem);
        font-weight: 950;
        letter-spacing: 0;
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.42);
      }

      html.dark #static-home-showcase {
        background:
          radial-gradient(circle at 15% 18%, rgba(16, 185, 129, 0.14), transparent 28rem),
          radial-gradient(circle at 85% 12%, rgba(14, 165, 233, 0.12), transparent 30rem),
          linear-gradient(135deg, #04130a 0%, #071426 58%, #050505 100%);
        color: #f8fafc;
      }

      html.dark .static-home-title {
        color: #f8fafc;
      }

      html.dark .static-home-theme-toggle,
      html.dark .static-home-kicker,
      html.dark .static-home-point,
      html.dark .static-home-button.secondary {
        border-color: rgba(255, 255, 255, 0.1);
        background: rgba(255, 255, 255, 0.06);
      }

      html.dark .static-home-theme-toggle {
        color: #f8fafc;
        box-shadow: 0 14px 36px rgba(0, 0, 0, 0.24);
      }

      html.dark .static-home-theme-toggle .sun-icon {
        display: none;
      }

      html.dark .static-home-theme-toggle .moon-icon {
        display: block;
      }

      html.dark .static-home-description,
      html.dark .static-home-point span {
        color: #94a3b8;
      }

      html.dark .static-home-button.secondary {
        color: #f8fafc;
      }

      html.dark .static-logo-card {
        opacity: 0.24;
        filter: saturate(0.9) contrast(0.94);
      }

      html.dark .static-logo-mark img {
        filter: drop-shadow(0 24px 38px rgba(0, 0, 0, 0.24));
      }

      @media (prefers-color-scheme: dark) {
        html:not(.light) #static-home-showcase {
          background:
            radial-gradient(circle at 15% 18%, rgba(16, 185, 129, 0.14), transparent 28rem),
            radial-gradient(circle at 85% 12%, rgba(14, 165, 233, 0.12), transparent 30rem),
            linear-gradient(135deg, #04130a 0%, #071426 58%, #050505 100%);
          color: #f8fafc;
        }

        html:not(.light) .static-home-title {
          color: #f8fafc;
        }

        html:not(.light) .static-home-theme-toggle,
        html:not(.light) .static-home-kicker,
        html:not(.light) .static-home-point,
        html:not(.light) .static-home-button.secondary {
          border-color: rgba(255, 255, 255, 0.1);
          background: rgba(255, 255, 255, 0.06);
        }

        html:not(.light) .static-home-theme-toggle {
          color: #f8fafc;
          box-shadow: 0 14px 36px rgba(0, 0, 0, 0.24);
        }

        html:not(.light) .static-home-theme-toggle .sun-icon {
          display: none;
        }

        html:not(.light) .static-home-theme-toggle .moon-icon {
          display: block;
        }

        html:not(.light) .static-home-description,
        html:not(.light) .static-home-point span {
          color: #94a3b8;
        }

        html:not(.light) .static-home-button.secondary {
          color: #f8fafc;
        }

        html:not(.light) .static-logo-card {
          opacity: 0.24;
          filter: saturate(0.9) contrast(0.94);
        }

        html:not(.light) .static-logo-mark img {
          filter: drop-shadow(0 24px 38px rgba(0, 0, 0, 0.24));
        }
      }

      @media (max-width: 1120px) {
        .static-home-title,
        .static-home-description {
          max-width: 860px;
        }

        .static-home-logo-stack {
          right: 1rem;
          width: min(520px, 52vw);
        }
      }

      @media (max-width: 760px) {
        .static-home-shell {
          position: relative;
          padding: 5rem 1rem 4rem;
        }

        .static-home-copy {
          position: relative;
          z-index: 2;
        }

        .static-home-points {
          grid-template-columns: 1fr;
        }

        .static-home-title {
          font-size: clamp(3rem, 15vw, 4.4rem);
        }

        .static-home-subtitle {
          font-size: clamp(2.15rem, 11vw, 3.35rem);
        }

        .static-home-description {
          max-width: none;
        }

        .static-home-logo-stack {
          position: absolute;
          top: 14.9rem;
          right: 0.2rem;
          z-index: 1;
          width: min(42vw, 10rem);
          overflow: visible;
          transform: none;
        }

        .static-logo-orbit {
          position: relative;
          height: 100%;
          width: 100%;
        }

        .static-logo-card {
          opacity: 0.15;
        }

        .static-logo-mark {
          width: 100%;
        }
      }

      @media (max-width: 420px) {
        .static-home-logo-stack {
          top: 14.6rem;
          width: 8.2rem;
        }
      }
    </style>
    <script>
      try {
        var savedTheme = localStorage.getItem('flowcore_theme');
        var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        var shouldUseDark = savedTheme === 'dark' || (!savedTheme && prefersDark);
        document.documentElement.classList.toggle('dark', shouldUseDark);
        document.documentElement.classList.toggle('light', !shouldUseDark);

        var staticHomePath = window.location.pathname.replace(/\/+$/, '') || '/';
        document.documentElement.setAttribute(
          'data-static-home',
          staticHomePath === '/' ? 'visible' : 'hidden'
        );

        var cachedSeo = localStorage.getItem('flowcore_cached_seo');
        if (cachedSeo) {
          var parsedSeo = JSON.parse(cachedSeo);
          if (parsedSeo && parsedSeo.title) document.title = parsedSeo.title;
        }
      } catch (error) {}
    </script>
  </head>
  <body>
    <section id="static-home-showcase" aria-label="PiLauncher static introduction">
      <button class="static-home-theme-toggle" type="button" data-static-theme-toggle aria-label="切换暗色模式" aria-pressed="false">
        <svg class="sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4"></circle>
          <path d="M12 2v2"></path>
          <path d="M12 20v2"></path>
          <path d="m4.93 4.93 1.41 1.41"></path>
          <path d="m17.66 17.66 1.41 1.41"></path>
          <path d="M2 12h2"></path>
          <path d="M20 12h2"></path>
          <path d="m6.34 17.66-1.41 1.41"></path>
          <path d="m19.07 4.93-1.41 1.41"></path>
        </svg>
        <svg class="moon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M20.99 13.49A9 9 0 1 1 10.51 3.01 7 7 0 0 0 20.99 13.49Z"></path>
        </svg>
      </button>
      <main class="static-home-shell">
        <div class="static-home-copy">
          <div class="static-home-kicker">Gamepad-compatible Minecraft launcher</div>
          <h1 class="static-home-title">
            PiLauncher
            <span class="static-home-subtitle">
              <span>支持手柄操作的</span>
              <span>MC启动器</span>
            </span>
          </h1>
          <p class="static-home-description">
            PiLauncher 是一款为掌机打造、兼容全平台的 Minecraft 启动器。让模组管理、账号登录和游戏启动更简单，也让玩家能更自然地在桌面、掌机与客厅场景之间切换。
          </p>
          <div class="static-home-actions" aria-label="页面操作">
            <a class="static-home-button primary" href="#root">立即下载PiLauncher</a>
            <a class="static-home-button secondary" href="/changelog">查看更新日志</a>
          </div>
          <div class="static-home-points" aria-label="核心能力">
            <article class="static-home-point">
              <strong>掌机友好</strong>
              <span>围绕手柄操作与移动场景优化，减少启动器在小屏设备上的操作负担。</span>
            </article>
            <article class="static-home-point">
              <strong>模组管理</strong>
              <span>面向 Minecraft 玩家整理模组、整合包和版本流程，让配置更直观。</span>
            </article>
            <article class="static-home-point">
              <strong>快速启动</strong>
              <span>账号登录、游戏启动与后续更新保持在同一体验里，少一点跳转，多一点顺手。</span>
            </article>
          </div>
        </div>
        <aside class="static-home-logo-stack" aria-hidden="true">
          <div class="static-logo-orbit" data-static-logo-stack>
            <div class="static-logo-card">
              <div class="static-logo-mark" data-static-logo-mark>
                <img src="/logo1024.png" alt="" decoding="async" loading="eager" />
              </div>
            </div>
          </div>
        </aside>
      </main>
    </section>
    <div id="root"></div>
    <script>
      (function () {
        var updateStaticHomeVisibility = function () {
          var path = window.location.pathname.replace(/\/+$/, '') || '/';
          document.documentElement.setAttribute(
            'data-static-home',
            path === '/' ? 'visible' : 'hidden'
          );
        };

        var wrapHistoryMethod = function (methodName) {
          var original = window.history[methodName];
          window.history[methodName] = function () {
            var result = original.apply(this, arguments);
            window.dispatchEvent(new Event('flowcore-route-change'));
            return result;
          };
        };

        wrapHistoryMethod('pushState');
        wrapHistoryMethod('replaceState');
        window.addEventListener('popstate', updateStaticHomeVisibility);
        window.addEventListener('flowcore-route-change', updateStaticHomeVisibility);
        updateStaticHomeVisibility();

        var themeToggle = document.querySelector('[data-static-theme-toggle]');
        var syncThemeToggle = function () {
          if (!themeToggle) return;
          themeToggle.setAttribute('aria-pressed', document.documentElement.classList.contains('dark') ? 'true' : 'false');
        };

        if (themeToggle) {
          themeToggle.addEventListener('click', function () {
            var nextIsDark = !document.documentElement.classList.contains('dark');
            document.documentElement.classList.toggle('dark', nextIsDark);
            document.documentElement.classList.toggle('light', !nextIsDark);
            localStorage.setItem('flowcore_theme', nextIsDark ? 'dark' : 'light');
            syncThemeToggle();
          });
          syncThemeToggle();
        }

        var logoStack = document.querySelector('[data-static-logo-stack]');
        var logoMarks = document.querySelectorAll('[data-static-logo-mark]');

        var getStaticAssetUrl = function (path) {
          if (!path) return '';
          if (/^(blob:|data:|https?:\/\/)/i.test(path)) return path;
          return path.charAt(0) === '/' ? path : '/' + path;
        };

        var applyStaticLogo = function (logoUrl, logoColor) {
          var resolvedLogoUrl = getStaticAssetUrl(logoUrl || '/logo1024.png');
          var resolvedLogoColor = logoColor || '#10b981';

          if (logoStack) {
            logoStack.style.setProperty('--static-logo-color', resolvedLogoColor);
          }

          logoMarks.forEach(function (mark) {
            mark.textContent = '';
            if (resolvedLogoUrl) {
              var img = document.createElement('img');
              img.src = resolvedLogoUrl;
              img.alt = '';
              img.decoding = 'async';
              img.loading = 'eager';
              mark.appendChild(img);
              return;
            }

            var fallback = document.createElement('div');
            fallback.className = 'static-logo-fallback';
            fallback.textContent = 'Pi';
            mark.appendChild(fallback);
          });
        };

        try {
          var cachedBootstrap = localStorage.getItem('flowcore_cached_home_bootstrap');
          if (cachedBootstrap) {
            var parsedBootstrap = JSON.parse(cachedBootstrap);
            if (parsedBootstrap && parsedBootstrap.hero) {
              applyStaticLogo(parsedBootstrap.hero.logoUrl, parsedBootstrap.hero.logoColor);
            }
          }
        } catch (error) {}

        if (window.fetch && logoStack) {
          fetch('/api/home/bootstrap')
            .then(function (response) {
              return response.ok ? response.json() : null;
            })
            .then(function (data) {
              if (data && data.hero) {
                localStorage.setItem('flowcore_cached_home_bootstrap', JSON.stringify(data));
                applyStaticLogo(data.hero.logoUrl, data.hero.logoColor);
              }
            })
            .catch(function () {});
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
