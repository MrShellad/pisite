    <style>
      :root {
        color-scheme: light dark;
        --static-pixel-font: "Pixelify Sans", Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        margin: 0;
      }

      html[data-static-home="hidden"] #static-home-showcase {
        display: none;
      }

      html.dark {
        color-scheme: dark;
      }

      #static-home-showcase {
        min-height: 100vh;
        overflow: hidden;
        background:
          radial-gradient(circle at 15% 18%, rgba(16, 185, 129, 0.18), transparent 28rem),
          radial-gradient(circle at 85% 12%, rgba(14, 165, 233, 0.16), transparent 30rem),
          linear-gradient(135deg, #ecfdf5 0%, #f8fafc 52%, #fffbeb 100%);
        color: #0f172a;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .static-home-theme-toggle {
        position: absolute;
        top: 1.25rem;
        right: 1.25rem;
        display: inline-flex;
        height: 2.75rem;
        width: 2.75rem;
        align-items: center;
        justify-content: center;
        border: 1px solid rgba(15, 23, 42, 0.12);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.78);
        color: #0f172a;
        box-shadow: 0 14px 36px rgba(15, 23, 42, 0.1);
        cursor: pointer;
        transition: border-color 0.2s ease, background 0.2s ease, color 0.2s ease, transform 0.2s ease;
      }

      .static-home-theme-toggle:hover {
        transform: translateY(-1px);
        border-color: rgba(16, 185, 129, 0.36);
      }

      .static-home-theme-toggle svg {
        height: 1.15rem;
        width: 1.15rem;
      }

      .static-home-theme-toggle .moon-icon {
        display: none;
      }

      .static-home-locale-toggle {
        position: absolute;
        top: 1.25rem;
        left: 1.25rem;
        right: 4.55rem;
        z-index: 2;
        display: inline-flex;
        align-items: center;
        width: fit-content;
        max-width: calc(100vw - 7rem);
        overflow-x: auto;
        border: 1px solid rgba(15, 23, 42, 0.12);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.78);
        padding: 0.22rem;
        box-shadow: 0 14px 36px rgba(15, 23, 42, 0.08);
        scrollbar-width: none;
        white-space: nowrap;
      }

      .static-home-locale-toggle::-webkit-scrollbar {
        display: none;
      }

      .static-home-locale-toggle button {
        min-width: 2.35rem;
        border: 0;
        border-radius: 999px;
        background: transparent;
        color: #64748b;
        cursor: pointer;
        font-size: 0.75rem;
        font-weight: 850;
        line-height: 1;
        padding: 0.63rem 0.55rem;
        transition: background 0.2s ease, color 0.2s ease;
      }

      .static-home-locale-toggle button.is-active {
        background: #059669;
        color: #fff;
      }

      #static-home-showcase[dir="rtl"] .static-home-copy {
        margin-left: auto;
        text-align: right;
      }

      #static-home-showcase[dir="rtl"] .static-home-actions {
        justify-content: flex-start;
      }

      #static-home-showcase[dir="rtl"] .static-home-subtitle span,
      #static-home-showcase[dir="rtl"] .static-home-kicker {
        margin-left: auto;
      }

      #static-home-showcase[dir="rtl"] .static-home-logo-stack {
        right: auto;
        left: clamp(1.5rem, 8vw, 7rem);
      }

      .static-home-shell {
        box-sizing: border-box;
        position: relative;
        display: block;
        min-height: 100vh;
        max-width: 1280px;
        margin: 0 auto;
        padding: 6rem 1.5rem 5rem;
      }

      .static-home-copy {
        position: relative;
        z-index: 2;
        min-width: 0;
        max-width: min(1080px, calc(100vw - 3rem));
      }

      .static-home-kicker {

        width: fit-content;
        align-items: center;
        gap: 0.5rem;
        border: 1px solid rgba(16, 185, 129, 0.24);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.74);
        padding: 0.45rem 0.8rem;
        color: #047857;
        font-size: 0.75rem;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .static-home-title {
        max-width: 720px;

        color: #0f172a;
        font-family: var(--static-pixel-font);
        font-weight: 700;
        font-size: clamp(3.5rem, 6.2vw, 5.75rem);

        letter-spacing: 0;

      .static-home-subtitle {
        display: block;
        margin-top: 0.26em;
        font-size: clamp(2.7rem, 4.8vw, 4.4rem);
        line-height: 1.08;
      }

      .static-home-subtitle span {
        display: block;
        width: fit-content;
        background: linear-gradient(90deg, #059669, #65a30d);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      .static-home-description {
        max-width: 620px;
        margin: 1.75rem 0 0;
        color: #475569;
        font-size: clamp(1rem, 1.6vw, 1.15rem);
        line-height: 1.85;
        white-space: pre-line;
      }

      .static-home-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.875rem;
        margin-top: 2.25rem;
      }

      .static-home-button {
        display: inline-flex;
        min-height: 3.25rem;
        align-items: center;
        justify-content: center;
        border-radius: 999px;
        padding: 0 1.35rem;
        border: 1px solid transparent;
        text-decoration: none;

        color: #fff;

      }

      .static-home-button.secondary {
        border-color: rgba(15, 23, 42, 0.12);
        background: rgba(255, 255, 255, 0.72);
        color: #0f172a;
      }

      .static-home-points {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 1rem;
        margin-top: 3rem;
        max-width: 1040px;
      }

      .static-home-point {
        box-sizing: border-box;
        min-height: 8rem;
        border: 1px solid rgba(15, 23, 42, 0.08);
        border-radius: 1rem;
        background: rgba(255, 255, 255, 0.68);
        padding: 1.15rem;
        box-shadow: 0 16px 50px rgba(15, 23, 42, 0.06);
      }

      .static-home-point strong {
        display: block;
        font-size: 0.95rem;
      }

      .static-home-point span {
        display: block;
        margin-top: 0.55rem;
        color: #64748b;
        font-size: 0.875rem;
        line-height: 1.6;
      }

      .static-home-logo-stack {
        position: absolute;
        top: 41%;
        right: clamp(1.5rem, 8vw, 7rem);
        z-index: 1;
        width: min(680px, 54vw);
        aspect-ratio: 1;
        overflow: visible;
        pointer-events: none;
        transform: translateY(-50%);
      }

      .static-logo-orbit {
        --static-logo-color: #10b981;
        position: relative;
        height: 100%;
        width: 100%;
        isolation: isolate;
      }

      .static-logo-orbit::before {
        position: absolute;
        inset: 14%;
        z-index: 0;
        border-radius: 999px;
        background:
          radial-gradient(circle, color-mix(in srgb, var(--static-logo-color) 22%, transparent) 0%, transparent 62%),
          radial-gradient(circle at 68% 26%, rgba(14, 165, 233, 0.12), transparent 42%);
        content: "";
        filter: blur(14px);
        opacity: 0.58;
      }

      .static-logo-card {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        opacity: 0.3;
        filter: saturate(0.96) contrast(0.98);
      }

      .static-logo-mark {
        position: relative;
        z-index: 1;
        display: grid;
        width: 88%;
        aspect-ratio: 1;
        place-items: center;
      }

      .static-logo-mark img {
        display: block;
        max-height: 100%;
        max-width: 100%;
        object-fit: contain;
        filter: drop-shadow(0 22px 38px rgba(15, 23, 42, 0.1));
      }

      .static-logo-fallback {
        display: grid;
        height: 100%;
        width: 100%;
        place-items: center;
        border-radius: 32%;
        background: linear-gradient(135deg, #059669, #65a30d);
        color: #fff;
        font-size: clamp(2.4rem, 7vw, 5.4rem);
        font-weight: 950;
        letter-spacing: 0;
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.42);
      }

      html.dark #static-home-showcase {
        background:
          radial-gradient(circle at 15% 18%, rgba(16, 185, 129, 0.14), transparent 28rem),
          radial-gradient(circle at 85% 12%, rgba(14, 165, 233, 0.12), transparent 30rem),
          linear-gradient(135deg, #04130a 0%, #071426 58%, #050505 100%);
        color: #f8fafc;
      }

      html.dark .static-home-title {
        color: #f8fafc;
      }

      html.dark .static-home-theme-toggle,
      html.dark .static-home-locale-toggle,
      html.dark .static-home-kicker,
      html.dark .static-home-point,
      html.dark .static-home-button.secondary {
        border-color: rgba(255, 255, 255, 0.1);
        background: rgba(255, 255, 255, 0.06);
      }

      html.dark .static-home-theme-toggle {
        color: #f8fafc;
        box-shadow: 0 14px 36px rgba(0, 0, 0, 0.24);
      }

      html.dark .static-home-theme-toggle .sun-icon {
        display: none;
      }

      html.dark .static-home-theme-toggle .moon-icon {
        display: block;
      }

      html.dark .static-home-description,
      html.dark .static-home-point span {
        color: #94a3b8;
      }

      html.dark .static-home-button.secondary {
        color: #f8fafc;
      }

      html.dark .static-home-locale-toggle button {
        color: #94a3b8;
      }

      html.dark .static-home-locale-toggle button.is-active {
        background: #10b981;
        color: #022c22;
      }

      html.dark .static-logo-card {
        opacity: 0.24;
        filter: saturate(0.9) contrast(0.94);
      }

      html.dark .static-logo-mark img {
        filter: drop-shadow(0 24px 38px rgba(0, 0, 0, 0.24));
      }

      @media (prefers-color-scheme: dark) {
        html:not(.light) #static-home-showcase {
          background:
            radial-gradient(circle at 15% 18%, rgba(16, 185, 129, 0.14), transparent 28rem),
            radial-gradient(circle at 85% 12%, rgba(14, 165, 233, 0.12), transparent 30rem),
            linear-gradient(135deg, #04130a 0%, #071426 58%, #050505 100%);
          color: #f8fafc;
        }

        html:not(.light) .static-home-title {
          color: #f8fafc;
        }

        html:not(.light) .static-home-theme-toggle,
        html:not(.light) .static-home-locale-toggle,
        html:not(.light) .static-home-kicker,
        html:not(.light) .static-home-point,
        html:not(.light) .static-home-button.secondary {
          border-color: rgba(255, 255, 255, 0.1);
          background: rgba(255, 255, 255, 0.06);
        }

        html:not(.light) .static-home-theme-toggle {
          color: #f8fafc;
          box-shadow: 0 14px 36px rgba(0, 0, 0, 0.24);
        }

        html:not(.light) .static-home-theme-toggle .sun-icon {
          display: none;
        }

        html:not(.light) .static-home-theme-toggle .moon-icon {
          display: block;
        }

        html:not(.light) .static-home-description,
        html:not(.light) .static-home-point span {
          color: #94a3b8;
        }

        html:not(.light) .static-home-button.secondary {
          color: #f8fafc;
        }

        html:not(.light) .static-home-locale-toggle button {
          color: #94a3b8;
        }

        html:not(.light) .static-home-locale-toggle button.is-active {
          background: #10b981;
          color: #022c22;
        }

        html:not(.light) .static-logo-card {
          opacity: 0.24;
          filter: saturate(0.9) contrast(0.94);
        }

        html:not(.light) .static-logo-mark img {
          filter: drop-shadow(0 24px 38px rgba(0, 0, 0, 0.24));
        }
      }

      @media (max-width: 1120px) {
        .static-home-title,
        .static-home-description {
          max-width: 860px;
        }

        .static-home-logo-stack {
          right: 1rem;
          width: min(520px, 52vw);
        }
      }

      @media (max-width: 760px) {
        .static-home-theme-toggle {
          top: 1rem;
          right: 1rem;
        }

        .static-home-locale-toggle {
          top: 1rem;
          left: 1rem;
          right: 4.1rem;
          max-width: calc(100vw - 5.8rem);
        }

        .static-home-shell {
          position: relative;
          padding: 5rem 1rem 4rem;
        }

        .static-home-copy {
          position: relative;
          z-index: 2;
        }

        .static-home-points {
          grid-template-columns: 1fr;
          max-width: none;
        }

        .static-home-title {
          font-size: clamp(3rem, 15vw, 4.4rem);
        }

        .static-home-subtitle {
          font-size: clamp(2.15rem, 11vw, 3.35rem);
        }

        .static-home-description {
          max-width: none;
        }

        .static-home-logo-stack {
          position: absolute;
          top: 14.9rem;
          right: 0.2rem;
          z-index: 1;
          width: min(42vw, 10rem);
          overflow: visible;
          transform: none;
        }

        #static-home-showcase[dir="rtl"] .static-home-logo-stack {
          right: auto;
          left: 0.2rem;
        }

        .static-logo-orbit {
          position: relative;
          height: 100%;
          width: 100%;
        }

        .static-logo-card {
          opacity: 0.15;
        }

        .static-logo-mark {
          width: 100%;
        }
      }

      @media (max-width: 420px) {
        .static-home-logo-stack {
          top: 14.6rem;
          width: 8.2rem;
        }
      }
    </style>
    <script>
      try {
        var savedTheme = localStorage.getItem('flowcore_theme');
        var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        var shouldUseDark = savedTheme === 'dark' || (!savedTheme && prefersDark);
        document.documentElement.classList.toggle('dark', shouldUseDark);
        document.documentElement.classList.toggle('light', !shouldUseDark);

        var staticHomePath = window.location.pathname.replace(/\/+$/, '') || '/';
        document.documentElement.setAttribute(
          'data-static-home',
          staticHomePath === '/' ? 'visible' : 'hidden'
        );

        var cachedSeo = localStorage.getItem('flowcore_cached_seo');
        if (cachedSeo) {
          var parsedSeo = JSON.parse(cachedSeo);
          if (parsedSeo && parsedSeo.title) document.title = parsedSeo.title;
        }
      } catch (error) {}
    </script>

    <script>
      (function () {
        var updateStaticHomeVisibility = function () {
          var path = window.location.pathname.replace(/\/+$/, '') || '/';
          document.documentElement.setAttribute(
            'data-static-home',
            path === '/' ? 'visible' : 'hidden'
          );
        };

        var wrapHistoryMethod = function (methodName) {
          var original = window.history[methodName];
          window.history[methodName] = function () {
            var result = original.apply(this, arguments);
            window.dispatchEvent(new Event('flowcore-route-change'));

        var getInitialStaticLocale = function () {
          try {
            var savedStaticLocale = localStorage.getItem('flowcore_static_locale');
            if (staticCopy[savedStaticLocale]) return savedStaticLocale;

            var savedLocale = localStorage.getItem('flowcore_locale');
            if (staticCopy[savedLocale]) return savedLocale;
          } catch (error) {}

          var browserLocales = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || ''];
          for (var index = 0; index < browserLocales.length; index += 1) {
            var browserLocale = String(browserLocales[index] || '').toLowerCase();
            if (!browserLocale) continue;
            if (browserLocale.indexOf('zh-tw') === 0 || browserLocale.indexOf('zh-hk') === 0 || browserLocale.indexOf('zh-mo') === 0 || browserLocale.indexOf('hant') !== -1) return 'zh-TW';
            if (browserLocale.indexOf('zh') === 0) return 'zh-CN';
            if (browserLocale.indexOf('ja') === 0) return 'ja';
            if (browserLocale.indexOf('ko') === 0) return 'ko';
            if (browserLocale.indexOf('fr') === 0) return 'fr';
            if (browserLocale.indexOf('ru') === 0) return 'ru';
            if (browserLocale.indexOf('es') === 0) return 'es';
            if (browserLocale.indexOf('ar') === 0) return 'ar';
            if (browserLocale.indexOf('en') === 0) return 'en';
          }

          return 'en';
        };

          var nextLocale = staticCopy[locale] ? locale : 'en';

          document.querySelectorAll('[data-static-i18n]').forEach(function (node) {
            var key = node.getAttribute('data-static-i18n');
            if (key && copy[key]) node.textContent = copy[key];
          });

            var isActive = button.getAttribute('data-static-locale-option') === nextLocale;
            button.classList.toggle('is-active', isActive);
            button.setAttribute('aria-pressed', isActive ? 'true' : 'false');
          });

          try {
            localStorage.setItem('flowcore_static_locale', nextLocale);
            if (nextLocale === 'zh-CN' || nextLocale === 'en') {
              localStorage.setItem('flowcore_locale', nextLocale);
            }
          } catch (error) {}
        };

        localeButtons.forEach(function (button) {
          button.addEventListener('click', function () {
            applyStaticLocale(button.getAttribute('data-static-locale-option'));

        var logoMarks = document.querySelectorAll('[data-static-logo-mark]');

        var getStaticAssetUrl = function (path) {
          if (!path) return '';
          if (/^(blob:|data:|https?:\/\/)/i.test(path)) return path;
          return path.charAt(0) === '/' ? path : '/' + path;
        };

        var applyStaticLogo = function (logoUrl, logoColor) {
          var resolvedLogoUrl = getStaticAssetUrl(logoUrl || '/logo1024.png');
          var resolvedLogoColor = logoColor || '#10b981';

          if (logoStack) {
            logoStack.style.setProperty('--static-logo-color', resolvedLogoColor);
          }

          logoMarks.forEach(function (mark) {
            mark.textContent = '';
            if (resolvedLogoUrl) {
              var img = document.createElement('img');
              img.src = resolvedLogoUrl;
              img.alt = '';
              img.decoding = 'async';
              img.loading = 'eager';
              mark.appendChild(img);
              return;
            }

            var fallback = document.createElement('div');
            fallback.className = 'static-logo-fallback';
            fallback.textContent = 'Pi';
            mark.appendChild(fallback);
          });
        };

          var cachedBootstrap = localStorage.getItem('flowcore_cached_home_bootstrap');
          if (cachedBootstrap) {
            var parsedBootstrap = JSON.parse(cachedBootstrap);
            if (parsedBootstrap && parsedBootstrap.hero) {
              applyStaticLogo(parsedBootstrap.hero.logoUrl, parsedBootstrap.hero.logoColor);
            }
          }
        } catch (error) {}

          fetch('/api/home/bootstrap')
            .then(function (response) {
              return response.ok ? response.json() : null;

            .then(function (data) {
              if (data && data.hero) {
                localStorage.setItem('flowcore_cached_home_bootstrap', JSON.stringify(data));
                applyStaticLogo(data.hero.logoUrl, data.hero.logoColor);
              }
            })
            .catch(function () {});
        }

    <script type="module">
      var flowcoreDynamicHomeLoaded = false;

      function loadFlowcoreDynamicHome() {
        if (flowcoreDynamicHomeLoaded) return;
        flowcoreDynamicHomeLoaded = true;
        import('/src/main.tsx');
      }

      window.__flowcoreLoadDynamicHome = loadFlowcoreDynamicHome;

      var flowcorePath = window.location.pathname.replace(/\/+$/, '') || '/';
      if (flowcorePath !== '/') {
        loadFlowcoreDynamicHome();
      } else {
        document.querySelectorAll('[data-static-dynamic-trigger]').forEach(function (node) {
          node.addEventListener('click', loadFlowcoreDynamicHome, { once: true });
        });

        window.addEventListener('scroll', function () {
          if (window.scrollY > 120) loadFlowcoreDynamicHome();
        }, { once: true, passive: true });

        if ('requestIdleCallback' in window) {
          window.requestIdleCallback(loadFlowcoreDynamicHome, { timeout: 2600 });
        } else {
          window.setTimeout(loadFlowcoreDynamicHome, 1600);
        }
      }
