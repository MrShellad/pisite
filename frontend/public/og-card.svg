<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">PiLauncher</title>
  <desc id="desc">PiLauncher - 支持手柄操作的MC启动器</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ecfdf5"/>
      <stop offset="0.5" stop-color="#eff6ff"/>
      <stop offset="1" stop-color="#fffbeb"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#10b981"/>
      <stop offset="1" stop-color="#84cc16"/>
    </linearGradient>
    <filter id="shadow" color-interpolation-filters="sRGB" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="28" stdDeviation="28" flood-color="#065f46" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1020" cy="110" r="260" fill="#a7f3d0" opacity="0.36"/>
  <circle cx="140" cy="560" r="260" fill="#bfdbfe" opacity="0.42"/>
  <g filter="url(#shadow)">
    <rect x="88" y="74" width="1024" height="482" rx="56" fill="#ffffff" opacity="0.82"/>
    <rect x="88" y="74" width="1024" height="482" rx="56" fill="none" stroke="#d1fae5" stroke-width="2"/>
  </g>
  <g transform="translate(148 132)">
    <rect width="104" height="104" rx="30" fill="url(#accent)"/>
    <path d="M31 61c19-4 22-34 43-38-8 15 0 28-16 44-9 9-21 14-34 16 14 11 35 12 53 3" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="148" y="314" fill="#0f172a" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="78" font-weight="800" letter-spacing="0">PiLauncher</text>
  <text x="148" y="386" fill="#047857" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="42" font-weight="700">支持手柄操作的MC启动器</text>
  <text x="148" y="456" fill="#475569" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="30">为掌机打造，兼容全平台，让模组管理、账号登录和游戏启动更简单。</text>
  <g transform="translate(148 492)">
    <rect width="190" height="48" rx="24" fill="#064e3b"/>
    <text x="95" y="32" text-anchor="middle" fill="#fff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700">Download PiLauncher</text>
  </g>
